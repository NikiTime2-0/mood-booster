<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fffaf6">
  <title>Mood Booster</title>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="doll.css">
  <script defer src="texte.js"></script>
  <script defer src="app.js"></script>
  <script defer src="doll.js"></script>
</head>
<body>
  <main>
    <header>
      <span class="brand-star" aria-hidden="true">✦</span>
      <h1>Mood <em>Booster</em></h1>
      <p>Ein kleiner Lichtblick.</p>
    </header>
    <section class="greeting" aria-label="Nachricht">
      <span id="greeting-icon" aria-hidden="true">☀</span>
      <p id="greeting" aria-live="polite">Hallo ✦</p>
    </section>
    <figure class="quote">
      <span class="quotation" aria-hidden="true">“</span>
      <blockquote id="quote" aria-live="polite">Don’t let the hard days win.</blockquote>
      <figcaption>Ein neuer Spruch zur nächsten vollen Stunde</figcaption>
      <span class="sparkle" aria-hidden="true">✦</span>
    </figure>
    <div class="mascot" aria-hidden="true">
      <span>✧</span><img src="penguin.png" alt="" width="135" height="135"><span>✦</span>
    </div>
    <details id="stats" hidden>
      <summary>Besuchsstatistik</summary>
      <p>Mit deiner Zustimmung zählt Umami deinen Seitenbesuch und erfasst die Besuchszeit, den Browser, das Betriebssystem und die Gerätekategorie.</p>
      <button id="stats-choice" type="button">Statistik erlauben</button>
      <p id="stats-status" role="status"></p>
    </details>
  </main>
</body>
</html>
